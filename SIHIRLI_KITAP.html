<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihirli Kütüphaneci</title>
    <style>
        :root {
            --primary: #5c4033;
            --accent: #c29b6e;
            --bg-color: #faf6f0;
            --card-bg: #ffffff;
            --text-color: #2e2b2a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Georgia', serif;
            line-height: 1.7;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            scroll-behavior: smooth;
        }

        .book-container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            /* Sayfa açılış animasyonu */
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            color: var(--primary);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 12px;
            margin-top: 0;
            font-size: 2.2rem;
        }

        h2 {
            color: var(--primary);
            margin-top: 35px;
            font-size: 1.5rem;
        }

        hr {
            border: 0;
            height: 1px;
            background: #e3d5c6;
            margin: 20px 0;
        }

        /* Dinamik efektler için geçişler */
        .animated-section {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .animated-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(92, 64, 51, 0.08);
        }

        .link-hover {
            color: var(--primary);
            text-decoration: none;
            border-bottom: 1px dashed var(--primary);
            transition: color 0.3s, border-bottom 0.3s;
        }

        .link-hover:hover {
            color: var(--accent);
            border-bottom: 1px solid var(--accent);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="book-container animated-section">
        <h1>Sihirli Kütüphaneci</h1>
        <p><strong>Yazan:</strong> Yazar</p>
        <p><strong>Oluşturulma Tarihi:</strong> 06.05.2026 | <strong>Versiyon:</strong> 1.0</p>
        
        <hr>

        <h2>İçindekiler</h2>
        <ul>
            <li><a href="#girizgah" class="link-hover">Girizgah</a> (1 dakika okuma)</li>
        </ul>

        <hr>

        <h2 id="girizgah">Girizgah</h2>
        <p><em>Yaklaşık 1 dakika okuma süresi</em></p>
        <p>Girizgah metniniz buraya gelecek...</p>
    </div>

</body>
</html>

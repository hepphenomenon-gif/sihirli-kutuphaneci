name: Magic E-Book Builder

on:
  push:
    branches: [ "main" ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Run Magic Librarian
      run: python magic_librarian.py
    - name: Deploy to GitHub
      run: |
        git config --global user.name 'Magic-Librarian-Bot'
        git config --global user.email 'librarian@magic.com'
        git add indeks.json SIHIRLI_KITAP.html
        git commit -m "📜 Kitabın yeni nüshası hazırlandı: $(date)" || echo "Değişiklik yok"
        git push
